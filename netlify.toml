[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Content pages are real HTML files. Unknown URLs should return 404,
# not the home page (which previously looked like a thin duplicate page).

# Environment variables for production (set these in Netlify dashboard)
# REACT_APP_GITHUB_URL=https://github.com/yourusername
# REACT_APP_LINKEDIN_URL=https://linkedin.com/in/yourprofile
